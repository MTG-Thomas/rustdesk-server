version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
