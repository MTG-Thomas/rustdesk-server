version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /ui/html
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-patch-days: 7
  - package-ecosystem: cargo
    directory: /
    target-branch: codex/websocket-registration
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: codex/websocket-registration
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: codex/websocket-registration
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /ui/html
    target-branch: codex/websocket-registration
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-patch-days: 7
