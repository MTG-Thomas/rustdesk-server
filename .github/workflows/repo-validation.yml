name: Repository validation
on:
  pull_request:
  push:
    branches: [master]
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: repo-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [format, clippy, test, audit, coverage, sbom]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Exercise patch provenance and dirty-work protection
        run: python3 -m unittest discover -s tests -p test_common_patch.py
      - name: Apply the verified downstream common patch
        run: python3 scripts/apply_common_patch.py
      - name: Install native build prerequisites
        if: matrix.check != 'sbom'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsodium-dev libssl-dev libclang-dev autoconf automake libtool
      - name: Install the release Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Generate version source through the native build
        if: matrix.check == 'format'
        run: cargo +1.90.0 check --locked --workspace
      - name: Check formatting without rewriting source
        if: matrix.check == 'format'
        run: cargo +1.90.0 fmt --all -- --check
      - name: Check Rust diagnostics
        if: matrix.check == 'clippy'
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo +1.90.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run workspace tests
        if: matrix.check == 'test'
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo +1.90.0 test --locked --workspace --all-features
      - name: Install the pinned RustSec auditor
        if: matrix.check == 'audit'
        run: |
          cargo +1.90.0 install cargo-audit --version 0.22.2 --locked
          cargo +1.90.0 install cargo-auditable --version 0.7.7 --locked
      - name: Audit complete dependency metadata in the server binaries
        if: matrix.check == 'audit'
        run: |
          cargo +1.90.0 auditable build --locked --bins
          python3 scripts/check_auditable.py target/debug/hbbs target/debug/hbbr target/debug/rustdesk-utils
          cargo +1.90.0 audit --file Cargo.lock
          cargo +1.90.0 audit bin target/debug/hbbs target/debug/hbbr target/debug/rustdesk-utils
      - name: Measure workspace coverage
        if: matrix.check == 'coverage'
        run: |
          rustup component add llvm-tools-preview --toolchain 1.90.0
          cargo +1.90.0 install cargo-llvm-cov --version 0.9.1 --locked
          mkdir -p artifacts
          cargo +1.90.0 llvm-cov --locked --workspace --all-features --lcov --output-path artifacts/lcov.info
      - name: Generate the complete resolved dependency SBOM
        if: matrix.check == 'sbom'
        run: |
          cargo +1.90.0 install cargo-cyclonedx --version 0.5.9 --locked
          cargo +1.90.0 cyclonedx --all --all-features --format json --spec-version 1.5
          mkdir -p artifacts
          find . -name '*.cdx.json' -not -path './target/*' -exec cp {} artifacts/ \;
          test -n "$(find artifacts -name '*.cdx.json' -print -quit)"
      - name: Preserve coverage or dependency evidence
        if: matrix.check == 'coverage' || matrix.check == 'sbom'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-${{ matrix.check }}
          path: artifacts/
          if-no-files-found: error
  image:
    name: Quick Support / security and protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Detect maintained Quick Support image
        id: scope
        run: |
          if test -f Dockerfile.quick-support; then
            echo 'image=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No Quick Support image on this branch; Rust checks still apply.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build and exercise BusyBox security and RustDesk protocol
        if: steps.scope.outputs.image == 'true'
        run: docker build -f Dockerfile.quick-support -t rustdesk-pr-validation .
      - name: Verify installed applet aliases and S6 lifecycle
        if: steps.scope.outputs.image == 'true'
        run: python3 tests/s6_runtime_smoke.py rustdesk-pr-validation
  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions, python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Exercise patch provenance and dirty-work protection
        run: python3 -m unittest discover -s tests -p test_common_patch.py
      - name: Apply the verified downstream common patch
        run: python3 scripts/apply_common_patch.py
      - name: Install Node for the authored UI assets
        if: matrix.language == 'rust' || matrix.language == 'javascript-typescript'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build the assets required by Tauri source analysis
        if: matrix.language == 'rust' || matrix.language == 'javascript-typescript'
        working-directory: ui/html
        run: |
          npm ci
          npm audit
          npm run build
      - name: Install Rust analysis prerequisites
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsodium-dev libssl-dev libclang-dev autoconf automake libtool
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      - name: Initialize source analysis
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze and upload source findings
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
