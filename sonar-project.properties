sonar.organization=mtg-thomas
sonar.projectKey=MTG-Thomas_rustdesk-server
sonar.projectName=RustDesk Server
sonar.host.url=https://sonarcloud.io
sonar.sources=src,libs/hbb_common/src,ui,scripts
sonar.tests=tests
# Build outputs and generated protobuf/version source are not authored source.
sonar.exclusions=**/node_modules/**,**/target/**,ui/html/dist/**,src/version.rs
sonar.rust.lcov.reportPaths=artifacts/lcov.info
sonar.rust.clippyReport.reportPaths=artifacts/clippy.json
